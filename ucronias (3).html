<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ucronías</title>
<style>
  :root{
    --f: "Helvetica Neue", HelveticaNeue, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    --ink:#2b2b2b; --soft:#8c8c8c; --line:#a9a9a9;
  }
  html,body{margin:0;height:100%;background:#fff;overflow:hidden;
    font-family:var(--f);font-weight:300;color:var(--ink);
    -webkit-font-smoothing:antialiased;user-select:none}
  body.idle, body.idle *{cursor:none !important}
  canvas{display:block}

  #panel{position:fixed;left:50%;bottom:5vh;width:min(470px,86vw);
    transform:translate(-50%,14px);opacity:0;pointer-events:none;
    background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    padding:24px 28px 20px;box-sizing:border-box;
    transition:opacity .7s ease, transform .7s ease}
  #panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  #panel *{box-sizing:border-box}

  .x{position:absolute;top:10px;right:14px;font-size:15px;color:var(--soft);cursor:pointer;line-height:1}
  .x:hover{color:var(--ink)}

  textarea,input[type=datetime-local]{font:inherit;font-weight:300;font-size:15px;color:var(--ink);
    border:0;border-bottom:1px solid #d2d2d2;background:transparent;width:100%;resize:none;
    outline:none;padding:7px 0;border-radius:0;user-select:text}
  textarea:focus,input:focus{border-bottom-color:#555}
  textarea::placeholder{color:#b4b4b4}
  input[type=datetime-local]{font-size:13px;letter-spacing:.03em;color:#555}
  .row{margin:0 0 14px}
  .lab{font-size:10px;letter-spacing:.14em;text-transform:lowercase;color:var(--soft);margin-bottom:2px}
  .choice{display:flex;gap:20px;margin:4px 0 12px}
  .choice span{cursor:pointer;font-size:11px;letter-spacing:.14em;color:#a5a5a5;padding-bottom:2px;border-bottom:1px solid transparent}
  .choice span:hover{color:var(--ink)}
  .choice span.on{color:var(--ink);border-bottom-color:var(--ink)}
  .media{min-height:18px;font-size:11px;letter-spacing:.08em;color:#666;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .media img{max-height:54px;max-width:90px;display:block}
  .act{cursor:pointer;color:#555;border-bottom:1px solid #cfcfcf}
  .act:hover{color:#000;border-bottom-color:#000}
  .rec{color:#000}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;border:1px solid #333;margin-right:6px;vertical-align:1px}
  .rec .dot{background:#333;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.2}}
  .end{display:flex;justify-content:flex-end;margin:6px 0 0}
  .go{cursor:pointer;font-size:12px;letter-spacing:.2em;color:var(--ink);border-bottom:1px solid var(--ink);padding-bottom:2px}
  .go.off{color:#bbb;border-bottom-color:#ddd}
  .need{animation:need .5s}
  @keyframes need{30%{border-bottom-color:#000;transform:translateX(-3px)}60%{transform:translateX(3px)}}

  .card{margin:0 0 16px;padding:16px 0 14px;border-top:1px solid #e2e2e2;border-bottom:1px solid #e2e2e2;
    transform-origin:50% 50%;animation:flip 1.1s cubic-bezier(.2,.7,.2,1)}
  @keyframes flip{0%{transform:perspective(700px) rotateX(-88deg);opacity:0}100%{transform:none;opacity:1}}
  .qts{font-size:30px;font-weight:200;letter-spacing:.04em;margin:0 0 6px}
  .q{font-size:16px;line-height:1.35}
  .h{font-size:12px;line-height:1.4;color:var(--soft);margin-top:8px}
  .ref{font-size:11px;color:var(--soft);letter-spacing:.03em;margin:0 0 6px;line-height:1.4}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel"></div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fAud" accept="audio/*" hidden>

<script>
(() => {
"use strict";

/* ------------------------------------------------------------------ */
/*  tiempo de apertura                                                 */
/* ------------------------------------------------------------------ */
const OPEN = new Date();
const pad = n => String(n).padStart(2, "0");
const stamp = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
                   pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
const OPEN_STAMP = stamp(OPEN);
const localISO = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
                      "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());

const FONT = getComputedStyle(document.documentElement).getPropertyValue("--f").trim();
const INK = "43,43,43";

/* ------------------------------------------------------------------ */
/*  cartas QTS                                                         */
/* ------------------------------------------------------------------ */
const CARDS = [
 ["la decisión opuesta","¿hubieras tomado exactamente la decisión opuesta en ese momento?","Si dijiste que sí, dices que no; si te quedaste, te fuiste; si callaste, hablaste."],
 ["seis meses después","¿hubieras pospuesto esa decisión seis meses más?","¿Qué habría cambiado mientras tanto en tu entorno o en ti?"],
 ["otra persona decide","¿alguien más hubiera decidido por ti en ese instante?","¿Cómo habría sido el resultado si la elección hubiera estado en manos de un familiar, amigo o desconocido?"],
 ["el imprevisto","¿un imprevisto climático o logístico hubiera cancelado o impedido que ese hecho ocurriera?","Un aguacero, un paro de transporte, una enfermedad repentina, un olvido."],
 ["una hora antes o después","¿hubieras llegado a ese momento una hora más tarde o una hora más temprano?","¿Con quién te habrías cruzado o de qué te habrías salvado o perdido?"],
 ["el objeto que falla","¿un objeto clave involucrado en ese recuerdo hubiera fallado o desaparecido?","El teléfono sin batería, las llaves perdidas, una carta que no llegó."],
 ["la ausencia","¿una persona clave en ese evento nunca hubiera estado presente?","¿Cómo se resuelve o se vive esa situación en total soledad o con otra compañía?"],
 ["el testigo","¿un testigo inesperado o un extraño hubiera presenciado e intervenido en ese momento?",""],
 ["el apoyo no pedido","¿hubieras contado con el apoyo de alguien a quien nunca le pediste ayuda?",""],
 ["otro ánimo","¿te hubieras tomado ese momento con absoluta calma en lugar de prisa o angustia (o viceversa)?","¿Cómo cambia el desenlace al reaccionar desde otro estado de ánimo?"],
 ["la verdad","¿te hubieras enterado de la verdad de algo que descubriste mucho después (o que aún no sabes)?",""],
 ["el olvido","¿no le hubieras dado ninguna importancia a lo que pasó y lo hubieras olvidado al día siguiente?",""],
 ["el triple","¿hubieras contado con el triple de recursos (dinero, tiempo, información) para afrontar ese momento?",""],
 ["sin recursos","¿te hubieras quedado completamente sin recursos en la mitad de la situación?",""]
];
let deck = [];
function drawCard(){
  if (!deck.length) { deck = CARDS.map((_, i) => i); for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; } }
  return CARDS[deck.pop()];
}

/* ------------------------------------------------------------------ */
/*  utilidades                                                         */
/* ------------------------------------------------------------------ */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - t, 3);
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let seedCounter = 1;
const newSeed = () => (Math.random() * 1e9 | 0) + (seedCounter++);

const STOP = new Set(("a al algo alguien algun alguna algunas algunos ante antes aqui asi aun aunque bajo bien cada casi como con contra cual cuales cuando cuanto de del desde donde dos el ella ellas ello ellos en entre era eran eres es esa esas ese eso esos esta estaba estado estan estar este esto estos estoy fue fueron fui ha habia haber habria hace hacer hacia han has hasta hay he hemos hubiera hubieras hubiese la las le les lo los mas me mi mia mio mis mucho muy nada ni no nos nosotros nunca o otra otras otro otros para pero poco por porque que quien quienes se sea ser si sido siempre sin sobre solo son su sus tal tambien tan tanto te tener tenia ti tiene todo todos tu tus un una uno unos y ya yo dia dias vez veces cosa cosas momento entonces luego despues mismo misma tenia tuve hice habia hubo estuve").split(" "));
function tokens(text){
  const out = new Set();
  text.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .split(/[^a-z0-9]+/).forEach(w => {
      if (w.length < 4 || STOP.has(w)) return;
      if (w.length > 5 && w.endsWith("es")) w = w.slice(0, -2);
      else if (w.length > 4 && w.endsWith("s")) w = w.slice(0, -1);
      out.add(w);
    });
  return out;
}
function firstForm(text, root){
  const words = text.split(/\s+/);
  for (const w of words) {
    const n = w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
    if (n.startsWith(root)) return w.replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  }
  return root;
}

/* ------------------------------------------------------------------ */
/*  lienzo                                                             */
/* ------------------------------------------------------------------ */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let W, H, DPR, CX, CY, R, circleA = [], circleB = [];
const nodes = [], links = [];
let now = 0;

/* el círculo vivo: respira, se deforma lentamente y late cuando recibe un hilo */
const ringCache = {};
function ringParams(seed){
  if (!ringCache[seed]) { const r = mulberry32(seed); ringCache[seed] = { a1: r()*6.28, a2: r()*6.28, a3: r()*6.28, start: r()*6.28 }; }
  return ringCache[seed];
}
let beats = [];            // latidos: {t, ang}
function heartbeat(ang){ beats.push({ t: performance.now(), ang }); if (beats.length > 6) beats.shift(); }
function ringR(ang, seed, t, e){
  const P = ringParams(seed);
  let rr = R
    + Math.sin(ang * 3 + P.a1) * 0.8 + Math.sin(ang * 7 + P.a2) * 0.45            // irregularidad de la lana
    + Math.sin(t * 0.00072 + seed * 0.1) * 2.6                                       // respiración (~9 s)
    + Math.sin(t * 0.0017 + seed) * 0.6                                              // segundo pulso, más corto
    + Math.sin(ang * 2 + t * 0.00021 + P.a3) * 2.4                                   // deformación lenta, como un cuerpo
    + Math.sin(ang * 3 - t * 0.00033 + P.a1) * 1.6
    + Math.sin(ang * 5 + t * 0.0009 + P.a2) * (0.8 + e * 3.5)                        // ondas que lo recorren
    + Math.sin(ang * 11 - t * 0.0021 + P.a1) * (0.3 + e * 1.8);
  for (const b of beats) {                                                           // latido al atarse un hilo
    const dt = t - b.t; if (dt < 0 || dt > 2600) continue;
    const decay = Math.exp(-dt / 700);
    let da = Math.abs(((ang - b.ang + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI);
    const local = Math.exp(-da * da / 0.5);
    rr += Math.sin(dt * 0.012) * decay * (2.2 + local * 6);
  }
  return rr;
}
function circlePts(seed, turn, t, e, dr = 0){
  const P = ringParams(seed);
  const n = Math.ceil(2 * Math.PI * R * turn / 3);
  const drift = t * 0.00004 * (seed % 2 ? 1 : -1);          // la vuelta de lana se desliza
  const pts = [];
  for (let i = 0; i < n; i++) {
    const ang = P.start + drift + i / (n - 1) * turn * Math.PI * 2;
    const rr = ringR(ang, seed, t, e) + dr;
    pts.push({ x: CX + Math.cos(ang) * rr, y: CY + Math.sin(ang) * rr });
  }
  return pts;
}
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2; R = Math.min(W, H) * 0.125;
  nodes.forEach(placeTarget);
}
addEventListener("resize", resize);

/* hilo de lana: varias hebras torcidas + pelusa */
function wool(pts, seed, o = {}){
  const n = pts.length; if (n < 2) return;
  const rnd = mulberry32(seed);
  const strands = o.strands || 4, amp = o.amp ?? 1.05, alpha = o.alpha ?? 1, freq = o.freq || 0.21;
  const nx = new Float32Array(n), ny = new Float32Array(n), L = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    const dx = b.x - a.x, dy = b.y - a.y, m = Math.hypot(dx, dy) || 1;
    nx[i] = -dy / m; ny[i] = dx / m;
    if (i) L[i] = L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  }
  for (let s = 0; s < strands; s++) {
    const ph = s / strands * Math.PI * 2 + rnd() * 0.7 + now * 0.0011 * (o.twist ?? 1);
    const lw = 0.32 + rnd() * 0.42;
    const al = (0.34 + rnd() * 0.36) * alpha;
    const base = (rnd() - 0.5) * amp * 0.6;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const d = base + Math.sin(L[i] * freq + ph) * amp;
      const x = pts[i].x + nx[i] * d, y = pts[i].y + ny[i] * d;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.lineWidth = lw; ctx.strokeStyle = `rgba(${INK},${al})`; ctx.stroke();
  }
  const hc = o.hairs ?? Math.floor(L[n - 1] / 6);
  ctx.beginPath();
  for (let h = 0; h < hc; h++) {
    const i = Math.floor(rnd() * (n - 1));
    const p = pts[i];
    const side = (rnd() - 0.5) * 2.4 * amp;
    const ang = rnd() * Math.PI * 2 + Math.sin(now * 0.0017 + h * 1.7) * 0.5, len = 0.8 + rnd() * 3.4;
    const j1 = rnd() - 0.5, j2 = rnd() - 0.5;
    const x = p.x + nx[i] * side, y = p.y + ny[i] * side;
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(ang) * len * 0.6 + j1, y + Math.sin(ang) * len * 0.6 + j2,
                         x + Math.cos(ang) * len, y + Math.sin(ang) * len);
  }
  ctx.lineWidth = 0.3; ctx.strokeStyle = `rgba(${INK},${0.26 * alpha})`; ctx.stroke();
}

/* desplazamiento vivo: ondas que viajan por el hilo, con los extremos anclados */
function live(pts, seed, amp, speed = 1){
  const n = pts.length; if (n < 3 || amp <= 0) return pts;
  const ph = (seed % 1000) / 159;
  for (let i = 1; i < n - 1; i++) {
    const t = i / (n - 1), env = Math.sin(Math.PI * t);
    const a = pts[i - 1], b = pts[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, m = Math.hypot(dx, dy) || 1;
    const w = Math.sin(t * 9 - now * 0.0016 * speed + ph) * 0.6
            + Math.sin(t * 4 + now * 0.0009 * speed + ph * 2) * 0.4
            + Math.sin(t * 23 - now * 0.004 * speed + ph) * 0.12;
    const d = w * amp * env;
    pts[i] = { x: pts[i].x - dy / m * d, y: pts[i].y + dx / m * d };
  }
  return pts;
}
function energy(n){
  const s = n && n.snd; if (!s || !s.an || !s.playing) return 0;
  if (s.eFrame === now) return s.e;
  s.an.getByteTimeDomainData(s.data);
  let acc = 0; for (let i = 0; i < s.data.length; i++) { const v = (s.data[i] - 128) / 128; acc += v * v; }
  const rms = Math.sqrt(acc / s.data.length);
  s.e = (s.e || 0) * 0.7 + clamp(rms * 4, 0, 1) * 0.3; s.eFrame = now;
  return s.e;
}
function totalEnergy(){ let e = 0; for (const n of nodes) e = Math.max(e, energy(n)); return e; }
function cubicPts(p0, p1, p2, p3, prog){
  const len = (Math.hypot(p1.x - p0.x, p1.y - p0.y) + Math.hypot(p2.x - p1.x, p2.y - p1.y) +
               Math.hypot(p3.x - p2.x, p3.y - p2.y) + Math.hypot(p3.x - p0.x, p3.y - p0.y)) / 2;
  const n = Math.max(10, Math.ceil(len / 3.5));
  const m = Math.max(2, Math.ceil(n * prog) + 1);
  const pts = [];
  for (let i = 0; i < m; i++) {
    const t = Math.min(prog, i / n), u = 1 - t;
    pts.push({
      x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
      y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
    });
  }
  return pts;
}
function quadPts(p0, c, p2, prog){
  const len = (Math.hypot(c.x - p0.x, c.y - p0.y) + Math.hypot(p2.x - c.x, p2.y - c.y) + Math.hypot(p2.x - p0.x, p2.y - p0.y)) / 2;
  const n = Math.max(10, Math.ceil(len / 3.5));
  const m = Math.max(2, Math.ceil(n * prog) + 1);
  const pts = [];
  for (let i = 0; i < m; i++) {
    const t = Math.min(prog, i / n), u = 1 - t;
    pts.push({ x: u*u*p0.x + 2*u*t*c.x + t*t*p2.x, y: u*u*p0.y + 2*u*t*c.y + t*t*p2.y });
  }
  return pts;
}

/* ------------------------------------------------------------------ */
/*  medida de nodos                                                    */
/* ------------------------------------------------------------------ */
const LABEL_H = 15;
function wrap(text, maxW, font, maxLines){
  ctx.font = font;
  const words = text.replace(/\s+/g, " ").trim().split(" ");
  const lines = []; let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) { lines.length = maxLines; lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, "") + " …"; }
  return lines;
}
const F_TEXT = () => `300 13px ${FONT}`;
const F_CAP  = () => `300 9.5px ${FONT}`;
const F_LAB  = () => `300 9px ${FONT}`;

function measure(n){
  let w = 0, h = LABEL_H;
  ctx.font = F_LAB(); w = Math.max(w, ctx.measureText(n.label).width);
  if (n.kind === "text") {
    n.lines = wrap(n.text, 200, F_TEXT(), 7);
    ctx.font = F_TEXT();
    n.lines.forEach(l => w = Math.max(w, ctx.measureText(l).width));
    h += n.lines.length * 17;
    n.cap = [];
  } else {
    if (n.kind === "image") {
      const s = Math.min(1, 140 / n.img.naturalWidth, 115 / n.img.naturalHeight);
      n.iw = Math.max(20, n.img.naturalWidth * s); n.ih = Math.max(20, n.img.naturalHeight * s);
      w = Math.max(w, n.iw); h += n.ih;
    } else { w = Math.max(w, 60); h += 60; }
    n.cap = wrap(n.text, 160, F_CAP(), 2);
    ctx.font = F_CAP();
    n.cap.forEach(l => w = Math.max(w, ctx.measureText(l).width));
    h += 6 + n.cap.length * 12;
  }
  n.w = w; n.h = h;
}

const LOG_MIN = Math.log10(60), LOG_MAX = Math.log10(120 * 365.25 * 86400);
function placeTarget(n){
  if (n.side === "past") {
    const x0 = CX + R + n.w / 2 + 50, x1 = W - n.w / 2 - 24;
    n.tx = x0 + n.frac * Math.max(0, x1 - x0);
  } else {
    const x0 = CX - R - n.w / 2 - 50, x1 = n.w / 2 + 24;
    n.tx = x0 - n.frac * Math.max(0, x0 - x1);
  }
  n.hy = CY + n.hyFrac * H;
}

/* ------------------------------------------------------------------ */
/*  análisis: color de imagen y tono de sonido                         */
/* ------------------------------------------------------------------ */
function imgColor(img){
  try {
    const c = document.createElement("canvas"); c.width = c.height = 40;
    const g = c.getContext("2d"); g.drawImage(img, 0, 0, 40, 40);
    const d = g.getImageData(0, 0, 40, 40).data;
    const bins = Array.from({ length: 24 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
    let lum = 0, cnt = 0, wsum = 0;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255;
      const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = (mx + mn) / 2, ch = mx - mn;
      lum += l; cnt++;
      if (ch < 0.04) continue;
      let hue;
      if (mx === r) hue = ((gg - b) / ch) % 6; else if (mx === gg) hue = (b - r) / ch + 2; else hue = (r - gg) / ch + 4;
      hue = (hue * 60 + 360) % 360;
      const s = ch / (1 - Math.abs(2 * l - 1) || 1);
      const wgt = s * (1 - Math.abs(2 * l - 1));
      const bin = bins[Math.floor(hue / 15) % 24];
      bin.w += wgt; bin.r += d[i] * wgt; bin.g += d[i + 1] * wgt; bin.b += d[i + 2] * wgt; wsum += wgt;
    }
    lum /= cnt;
    let best = 0; bins.forEach((b, i) => { if (b.w > bins[best].w) best = i; });
    const B = bins[best];
    if (wsum / cnt < 0.07 || B.w === 0) { const v = Math.round(lum * 255); return { gray: true, lum, rgb: [v, v, v] }; }
    return { gray: false, lum, hue: best * 15 + 7.5, rgb: [B.r / B.w | 0, B.g / B.w | 0, B.b / B.w | 0] };
  } catch (e) { return null; }
}
function fft(re, im){
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < half; j++) {
        const k = i + j + half;
        const ar = re[k] * cr - im[k] * ci, ai = re[k] * ci + im[k] * cr;
        re[k] = re[i + j] - ar; im[k] = im[i + j] - ai;
        re[i + j] += ar; im[i + j] += ai;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}
function toneOf(buf){
  const x = buf.getChannelData(0), sr = buf.sampleRate, N = 2048;
  if (x.length < N) return null;
  const steps = Math.min(28, Math.floor(x.length / N));
  const freqs = [];
  const minBin = Math.ceil(60 / (sr / N));
  for (let k = 0; k < steps; k++) {
    const off = Math.floor(k * (x.length - N) / Math.max(1, steps - 1));
    let rms = 0;
    const re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < N; i++) { const v = x[off + i]; rms += v * v; re[i] = v * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1))); }
    if (Math.sqrt(rms / N) < 0.01) continue;
    fft(re, im);
    let pk = minBin, pv = 0;
    for (let i = minBin; i < N / 2; i++) { const m = re[i] * re[i] + im[i] * im[i]; if (m > pv) { pv = m; pk = i; } }
    freqs.push(pk * sr / N);
  }
  if (!freqs.length) return null;
  freqs.sort((a, b) => a - b);
  return freqs[freqs.length >> 1];
}
function peaksOf(buf, bins){
  const x = buf.getChannelData(0), out = [], step = Math.floor(x.length / bins) || 1;
  let max = 0;
  for (let b = 0; b < bins; b++) { let m = 0; for (let i = b * step; i < (b + 1) * step && i < x.length; i++) m = Math.max(m, Math.abs(x[i])); out.push(m); max = Math.max(max, m); }
  return out.map(v => v / (max || 1));
}

/* ------------------------------------------------------------------ */
/*  audio                                                              */
/* ------------------------------------------------------------------ */
let AC = null, master = null;
function initAudio(){
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  AC = new C();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -10; comp.ratio.value = 3; comp.knee.value = 12;
  master = AC.createGain(); master.gain.value = 0.8;
  master.connect(comp); comp.connect(AC.destination);
}
/* cada sonido es una capa independiente en bucle: todas suenan a la vez */
async function makeSound(blob){
  initAudio();
  const s = { an: null, pan: null, data: null, peaks: [], tone: null, playing: false, play: () => {} };
  let buf = null;
  if (AC) { try { buf = await AC.decodeAudioData((await blob.arrayBuffer()).slice(0)); } catch (e) { buf = null; } }

  if (buf) {
    s.tone = toneOf(buf); s.peaks = peaksOf(buf, 64);
    // nivelar cada capa (RMS) para que ninguna tape a las demás
    const x = buf.getChannelData(0); let acc = 0, cnt = 0;
    for (let i = 0; i < x.length; i += 8) { acc += x[i] * x[i]; cnt++; }
    const rms = Math.sqrt(acc / Math.max(1, cnt)) || 0.05;
    const g = AC.createGain(); g.gain.value = 0;
    s.level = clamp(0.12 / rms, 0.2, 4);
    s.an = AC.createAnalyser(); s.an.fftSize = 256; s.data = new Uint8Array(s.an.fftSize);
    let last = s.an;
    if (AC.createStereoPanner) { s.pan = AC.createStereoPanner(); last.connect(s.pan); last = s.pan; }
    last.connect(g); g.connect(master);
    s.play = () => {
      if (AC.state === "suspended") AC.resume();
      const src = AC.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.connect(s.an);
      // cada capa arranca en su propio punto del bucle; entra con un fundido suave
      src.start(0, Math.random() * buf.duration * 0.5);
      g.gain.setValueAtTime(0, AC.currentTime);
      g.gain.linearRampToValueAtTime(s.level, AC.currentTime + 2.5);
      s.src = src; s.playing = true;
    };
  } else {
    // respaldo: elemento de audio
    const el = new Audio(); el.src = URL.createObjectURL(blob); el.loop = true;
    s.play = () => { el.play().then(() => { s.playing = true; }).catch(() => {}); };
  }
  return s;
}

/* ------------------------------------------------------------------ */
/*  creación de nodos y convergencias                                  */
/* ------------------------------------------------------------------ */
async function createNode({ side, text, kind, file, blob, date, card }){
  const n = {
    id: nodes.length, side, text, kind, seed: newSeed(),
    tok: tokens(text), hyFrac: (Math.random() - 0.5) * 0.76, vx: 0, vy: 0
  };
  if (side === "past") {
    n.label = stamp(date);
    const s = Math.max(1, (OPEN - date) / 1000);
    n.frac = clamp((Math.log10(s) - LOG_MIN) / (LOG_MAX - LOG_MIN), 0, 1);
  } else {
    n.label = "QTS… " + card[0];
    n.frac = 0.05 + Math.random() * 0.95;
  }
  if (kind === "image") {
    n.img = new Image(); n.img.src = URL.createObjectURL(file);
    try { await n.img.decode(); } catch (e) { await new Promise(r => { n.img.onload = r; n.img.onerror = r; }); }
    n.color = imgColor(n.img);
  }
  if (kind === "sound") n.snd = await makeSound(blob);
  measure(n);
  placeTarget(n);
  n.x = n.tx; n.y = n.hy;
  n.born = performance.now();
  const d = Math.hypot(n.x - CX, n.y - CY);
  n.hairs = Math.floor(d / 6);
  nodes.push(n);
  setTimeout(() => heartbeat(Math.atan2(n.y - CY, n.x - CX)), 1500);
  if (n.snd) setTimeout(() => n.snd.play(), 1400);
  converge(n);
  return n;
}
function hueDist(a, b){ const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }
function converge(n){
  let k = 0;
  for (const m of nodes) {
    if (m === n || m.side !== n.side) continue;
    const pairCount = () => links.filter(l => (l.a === m && l.b === n) || (l.a === n && l.b === m)).length;
    const shared = [...n.tok].filter(t => m.tok.has(t));
    if (shared.length) {
      links.push({ a: m, b: n, type: "word", label: shared.slice(0, 2).map(r => firstForm(n.text, r)).join(" · "),
                   seed: newSeed(), k: pairCount(), born: performance.now() + 2300 + (k++) * 500 });
    }
    if (n.color && m.color) {
      const A = n.color, B = m.color;
      const close = (A.gray && B.gray) ? Math.abs(A.lum - B.lum) < 0.09
                  : (!A.gray && !B.gray) ? hueDist(A.hue, B.hue) <= 18 : false;
      if (close) links.push({ a: m, b: n, type: "color", rgb: A.rgb, seed: newSeed(), k: pairCount(), born: performance.now() + 2300 + (k++) * 500 });
    }
    if (n.snd && m.snd && n.snd.tone && m.snd.tone) {
      if (Math.abs(Math.log2(n.snd.tone / m.snd.tone)) < 0.12)
        links.push({ a: m, b: n, type: "tone", seed: newSeed(), k: pairCount(), born: performance.now() + 2300 + (k++) * 500 });
    }
  }
}

/* ------------------------------------------------------------------ */
/*  acomodo del tejido                                                 */
/* ------------------------------------------------------------------ */
function layout(){
  for (const n of nodes) {
    n.vx = n.vx * 0.82 + (n.tx - n.x) * 0.018;
    n.vy = n.vy * 0.82 + (n.hy - n.y) * 0.003;
  }
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j], pad = 22;
    const ox = (a.w + b.w) / 2 + pad - Math.abs(a.x - b.x);
    const oy = (a.h + b.h) / 2 + pad - Math.abs(a.y - b.y);
    if (ox > 0 && oy > 0) {
      if (oy < ox * 1.6) { const s = (a.y < b.y || (a.y === b.y && i % 2) ? -1 : 1) * oy * 0.05; a.vy += s; b.vy -= s; }
      else { const s = (a.x < b.x ? -1 : 1) * ox * 0.03; a.vx += s; b.vx -= s; }
    }
  }
  for (const l of links) {
    if (now < l.born) continue;
    const dy = l.b.y - l.a.y;
    l.a.vy += dy * 0.0006; l.b.vy -= dy * 0.0006;
  }
  for (const n of nodes) {
    n.x += n.vx; n.y += n.vy;
    const dx = n.x - CX, dy = n.y - CY, d = Math.hypot(dx, dy) || 1;
    const min = R + Math.hypot(n.w, n.h) / 2 + 26;
    if (d < min) { n.x = CX + dx / d * min; n.y = CY + dy / d * min; }
    if (n.side === "past") n.x = Math.max(n.x, CX + R + n.w / 2 + 30);
    else n.x = Math.min(n.x, CX - R - n.w / 2 - 30);
    n.x = clamp(n.x, n.w / 2 + 14, W - n.w / 2 - 14);
    n.y = clamp(n.y, n.h / 2 + 16, H - n.h / 2 - 16);
    if (n.snd && n.snd.pan) n.snd.pan.pan.value = clamp((n.x - CX) / (W / 2), -1, 1) * 0.4;
  }
}

/* ------------------------------------------------------------------ */
/*  dibujo                                                             */
/* ------------------------------------------------------------------ */
let hoverCircle = false, ctxE = 0;
function drawThread(n){
  const prog = ease(clamp((now - n.born) / 1600, 0, 1));
  const ang = Math.atan2(n.y - CY, n.x - CX);
  const rr = ringR(ang, 11, now, ctxE) - 0.5;
  const s = { x: CX + Math.cos(ang) * rr, y: CY + Math.sin(ang) * rr };
  const e = { x: n.x, y: n.y };
  const d = Math.hypot(e.x - s.x, e.y - s.y);
  const sway = Math.sin(now * 0.00035 + n.seed) * 3;
  const dir = n.side === "past" ? -1 : 1;
  const p1 = { x: s.x + Math.cos(ang) * d * 0.33, y: s.y + Math.sin(ang) * d * 0.33 + d * 0.06 + sway };
  const p2 = { x: e.x + dir * d * 0.33, y: e.y + d * 0.045 + sway };
  const en = energy(n);
  const amp = (2.2 + Math.min(d, 600) / 600 * 3 + en * 14) * prog;
  wool(live(cubicPts(s, p1, p2, e, prog), n.seed, amp, 1 + en * 3), n.seed, { hairs: n.hairs, twist: n.side === "past" ? 1 : -1 });
}
function drawLink(l){
  if (now < l.born) return;
  const prog = ease(clamp((now - l.born) / 1900, 0, 1));
  const a = l.a, b = l.b;
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  const sag = d * 0.16 + l.k * 16 + Math.sin(now * 0.0003 + l.seed) * 2;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + sag;
  const c = { x: mx, y: 2 * my - (a.y + b.y) / 2 };
  if (!l.hairs) l.hairs = Math.floor(d / 7);
  const en = Math.max(energy(a), energy(b));
  const pulse = 1.4 + Math.sin(now * 0.0006 + l.seed) * 0.8 + en * 8;
  wool(live(quadPts(a, c, b, prog), l.seed, pulse * prog, 0.8), l.seed, { strands: 3, amp: 0.85, alpha: 0.72, hairs: l.hairs, twist: 0.7 });
  const la = clamp((now - l.born - 1700) / 900, 0, 1);
  if (la > 0) {
    ctx.globalAlpha = la;
    if (l.type === "word") {
      ctx.font = F_LAB(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const tw = ctx.measureText(l.label).width;
      ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.fillRect(mx - tw / 2 - 4, my - 6, tw + 8, 12);
      ctx.fillStyle = "#7d7d7d"; ctx.fillText(l.label, mx, my);
    } else if (l.type === "color") {
      ctx.beginPath(); ctx.arc(mx, my, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${l.rgb.join(",")})`; ctx.fill();
      ctx.lineWidth = 0.5; ctx.strokeStyle = "#555"; ctx.stroke();
    } else {
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath();
      for (let i = 0; i <= 12; i++) { const x = mx - 4 + i * 8 / 12, y = my + Math.sin(i / 12 * Math.PI * 2) * 2; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.lineWidth = 0.6; ctx.strokeStyle = "#555"; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}
function drawSound(n, cx, cy){
  const r = 26;
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx, cy, r + 3, 0, Math.PI * 2); ctx.fill();
  const pts = [];
  const m = 70;
  for (let i = 0; i <= m; i++) { const a = i / m * Math.PI * 2.04; pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }); }
  wool(pts, n.seed + 7, { strands: 3, amp: 0.7, hairs: 22 });
  const s = n.snd; let vals = null;
  if (s && s.an && s.playing) { s.an.getByteTimeDomainData(s.data); vals = s.data; }
  ctx.beginPath();
  const K = 72, rot = now * 0.00015;
  for (let i = 0; i <= K; i++) {
    let v;
    if (vals) v = (vals[(i % K) * 3 % vals.length] - 128) / 128 * 2.2;
    else v = (s && s.peaks.length ? s.peaks[i % s.peaks.length] : 0.3) * 0.5;
    const a = i / K * Math.PI * 2 + rot;
    const rr = 13 + clamp(v, -1, 1) * 8;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.lineWidth = 0.55; ctx.strokeStyle = "rgba(43,43,43,.75)"; ctx.stroke();
}
function drawNode(n){
  const a = ease(clamp((now - n.born - 1300) / 900, 0, 1));
  if (a <= 0) return;
  ctx.globalAlpha = a;
  const top = n.y - n.h / 2, left = n.x - n.w / 2;
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.fillRect(left - 7, top - 5, n.w + 14, n.h + 10);
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = F_LAB(); ctx.fillStyle = "#8f8f8f";
  ctx.fillText(n.label, n.x, top);
  let y = top + LABEL_H;
  if (n.kind === "text") {
    ctx.font = F_TEXT(); ctx.fillStyle = "#2b2b2b";
    n.lines.forEach(l => { ctx.fillText(l, n.x, y); y += 17; });
  } else {
    if (n.kind === "image") { ctx.drawImage(n.img, n.x - n.iw / 2, y, n.iw, n.ih); y += n.ih; }
    else { drawSound(n, n.x, y + 30); y += 60; }
    y += 6;
    ctx.font = F_CAP(); ctx.fillStyle = "#7a7a7a";
    n.cap.forEach(l => { ctx.fillText(l, n.x, y); y += 12; });
  }
  ctx.globalAlpha = 1;
}
function drawCenter(){
  const al = hoverCircle ? 1 : 0.85;
  const e = totalEnergy();
  ctxE = e;
  const A = circlePts(11, 1.06, now, e);
  const B = circlePts(29, 1.03, now + 1800, e, 0.8);
  const C = circlePts(47, 0.62, now + 5200, e, -1.4);       // una tercera hebra suelta que se enrolla
  ctx.fillStyle = "#fff"; ctx.beginPath();
  A.forEach((p, i) => { const x = CX + (p.x - CX) * 0.96, y = CY + (p.y - CY) * 0.96; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.fill();
  wool(A, 11, { alpha: al, hairs: Math.floor(R * 1.3), twist: 0.9 });
  wool(B, 29, { strands: 3, alpha: al * 0.8, hairs: Math.floor(R * 0.8), twist: -0.7 });
  wool(C, 47, { strands: 2, alpha: al * 0.55, hairs: Math.floor(R * 0.4), twist: 1.3 });
  ctx.font = `300 100px ${FONT}`;
  const w100 = ctx.measureText(OPEN_STAMP).width;
  const fs = Math.min(100 * (2 * R * 0.76) / w100, R * 0.5);
  ctx.font = `300 ${fs}px ${FONT}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#2b2b2b";
  ctx.globalAlpha = 0.9 + Math.sin(now * 0.00072 + 1.1) * 0.08;
  ctx.fillText(OPEN_STAMP, CX, CY);
  ctx.globalAlpha = 1;
}
function frame(t){
  now = t;
  layout();
  ctx.clearRect(0, 0, W, H);
  links.forEach(drawLink);
  nodes.forEach(drawThread);
  drawCenter();
  nodes.forEach(drawNode);
  requestAnimationFrame(frame);
}

document.addEventListener("fullscreenchange", onFS);
document.addEventListener("webkitfullscreenchange", onFS);

function inCircle(x, y){ return Math.hypot(x - CX, y - CY) <= R + 6; }

  } else if (st.blob) {
    m.innerHTML = `<span>sonido listo</span><span class="act" id="ml">escuchar</span><span class="act" id="mr">grabar de nuevo</span><span class="act" id="mu">subir otro</span>`;
    document.getElementById("ml").onclick = () => { preview = new Audio(URL.createObjectURL(st.blob)); preview.play(); };
    document.getElementById("mr").onclick = startRec;
    document.getElementById("mu").onclick = () => fAud.click();
  } else {
    m.innerHTML = `<span class="act" id="mr"><span class="dot"></span>grabar</span><span class="act" id="mu">subir archivo</span>`;
    document.getElementById("mr").onclick = startRec;
    document.getElementById("mu").onclick = () => fAud.click();
  }
}
fImg.onchange = () => { if (fImg.files[0] && st) { st.file = fImg.files[0]; renderMedia(); } fImg.value = ""; };
fAud.onchange = () => { if (fAud.files[0] && st) { st.blob = fAud.files[0]; renderMedia(); } fAud.value = ""; };

let rec = null, recStream = null, recChunks = [], recT0 = 0, recTimer = null;
async function startRec(){
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    const m = document.getElementById("pm");
    if (m) m.innerHTML = `<span>el micrófono no está disponible</span><span class="act" id="mu">subir archivo</span>`;
    const u = document.getElementById("mu"); if (u) u.onclick = () => fAud.click();
    return;
  }
  recChunks = [];
  rec = new MediaRecorder(recStream);
  rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    recStream.getTracks().forEach(t => t.stop());
    clearInterval(recTimer);
    if (!rec.discard && st && recChunks.length) st.blob = new Blob(recChunks, { type: rec.mimeType || "audio/webm" });
    rec = null; renderMedia();
  };
  rec.start(); recT0 = performance.now();
  renderMedia();
  recTimer = setInterval(() => {
    const s = Math.floor((performance.now() - recT0) / 1000);
    const el = document.getElementById("mt"); if (el) el.textContent = pad(Math.floor(s / 60)) + ":" + pad(s % 60);
    if (s >= 60) stopRec(false);
  }, 250);
}
function stopRec(discard){
  if (rec && rec.state === "recording") { rec.discard = discard; rec.stop(); }
}

function need(id){ const el = document.getElementById(id); if (!el) return; el.classList.remove("need"); void el.offsetWidth; el.classList.add("need"); }
async function submit(){
  if (!st || st.sending) return;
  if (rec && rec.state === "recording") { need("pm"); return; }
  const text = document.getElementById("pt").value.trim();
  if (!text) { need("pt"); return; }
  let date = null;
  if (st.stage === "past") {
    const v = document.getElementById("pd").value;
    if (!v) { need("pd"); return; }
    date = new Date(v);
    if (isNaN(date)) { need("pd"); return; }
    if (date > OPEN) date = new Date(OPEN.getTime());
  }
  if (st.kind === "image" && !st.file) { need("pm"); return; }
  if (st.kind === "sound" && !st.blob) { need("pm"); return; }
  st.sending = true;
  document.getElementById("pg").classList.add("off");
  const stage = st.stage;
  const node = await createNode({
    side: stage === "past" ? "past" : "future",
    text, kind: st.kind, file: st.file, blob: st.blob, date, card: st.card
  });
  hidePanel();
  if (stage === "past") {
    currentPast = node;
    setTimeout(() => { if (busy) openQTS(); }, 2700);
  } else {
    node.parent = currentPast;
    setTimeout(() => { busy = false; st = null; currentPast = null; }, 1200);
  }
}

document.addEventListener("visibilitychange", () => { if (AC && AC.state === "suspended") AC.resume(); });
resize();
requestAnimationFrame(frame);
})();
</script>
